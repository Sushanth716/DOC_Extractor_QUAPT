[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extractor-ingestion"
version = "0.1.0"
description = "Module A: Document Ingestion & Preprocessing for Document Extraction Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Document Extraction Engine Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.0.0",
    "pypdfium2>=4.0.0",
    "Pillow>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "instructor>=1.0.0",
    "litellm>=1.40.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for foundational components",
    "security: Security and guardrail compliance tests",
]

